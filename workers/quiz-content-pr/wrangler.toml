name = "study-quiz-content-pr"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false
keep_vars = true

[vars]
# 公開してよい固定値だけをGit管理する。
GITHUB_OWNER = "ryoyr"
GITHUB_REPO = "study-quiz"
GITHUB_BASE_BRANCH = "main"
GITHUB_CONTENT_ROOT = "public/content"
ALLOWED_ORIGIN = "https://ryoyr.github.io"
ACCESS_TEAM_DOMAIN = "abrsb.cloudflareaccess.com"

# ACCESS_AUDとALLOWED_EMAILSはCloudflare Dashboardで設定し、keep_varsで維持する。
# GitHub App "study-quiz-content-manager" の次の値はwrangler secret putで登録する。
# GITHUB_APP_ID
# GITHUB_INSTALLATION_ID
# GITHUB_PRIVATE_KEY

# GitHub連携は頻度が低いため、利用者・API単位で1分10回に制限する。
# namespace_idは既存デプロイと同じアカウント内一意値を維持する。
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60
