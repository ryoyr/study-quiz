name = "study-quiz-content-db"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# GitHub PagesのOrigin。末尾スラッシュなし。
ALLOWED_ORIGIN = "https://ryoyr.github.io"
# Cloudflare Accessのteam domain / Application AUD / 書込み許可メールを実環境値へ変更する。
ACCESS_TEAM_DOMAIN = "replace-me.cloudflareaccess.com"
ACCESS_AUD = "replace-me"
ALLOWED_EMAILS = "replace-me@example.com"
ALLOW_LOCAL_WRITE = "false"

[[d1_databases]]
binding = "DB"
database_name = "study-quiz-db"
database_id = "e342a769-d2fc-493f-88a7-9aac70f7914c"
migrations_dir = "migrations"
